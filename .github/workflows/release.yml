name: Release agent binaries

# Publishes the prebuilt agent binaries as GitHub Release assets, which are served
# from GitHub's global CDN (free, versioned by tag). The control plane's install.sh
# downloads from here when AGENT_DIST_BASE_URL points at the release, instead of
# streaming the ~11 MB binary from the single-region app container.
#
# Cut a release:  git tag v1.4.0 && git push origin v1.4.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required to create the release + upload assets

# The Go project is not at the repo root — it lives under gpu-platform/. Run every
# shell step there so the Makefile, scripts/, go.mod and dist/ all resolve correctly.
defaults:
  run:
    working-directory: gpu-platform

jobs:
  release:
    name: Build + publish agent-<os>-<arch>
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: gpu-platform/go.sum   # go.sum isn't at the repo root

      # Reuse the same target matrix the installer expects; verify-dist fails the
      # release if any of the four artifacts is missing.
      - run: make agent-dist
      - run: bash scripts/verify-dist.sh --dir dist

      - name: Checksums
        run: cd dist && shasum -a 256 agent-* > checksums.txt && cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # File inputs to an action resolve from the repo root, NOT the
          # defaults.run.working-directory above (that only affects `run:` steps).
          files: |
            gpu-platform/dist/agent-darwin-arm64
            gpu-platform/dist/agent-darwin-amd64
            gpu-platform/dist/agent-linux-amd64
            gpu-platform/dist/agent-linux-arm64
            gpu-platform/dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
