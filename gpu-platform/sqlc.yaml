version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"          # sqlc reads the DDL from migrations
    queries: "internal/db/queries" # hand-written SQL lives here
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"   # generated, git-ignored
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
